spring:
  datasource:
    url: jdbc:h2:mem:medrecycle;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage-limit-days: 14
  cabinet-warn-ratio: 0.8
  default-pickup-threshold-grams: 50000
